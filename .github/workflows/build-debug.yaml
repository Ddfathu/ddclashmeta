name: Build Debug

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  BuildDebug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          if [ -d "core/src/foss/golang/clash/component/ca" ]; then
            cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt
          fi

      - name: Grant Execute Permission
        run: chmod +x ./gradlew

      # Gunakan task build bawaan yang terbukti valid
      - name: Build APK (Alpha Release)
        run: ./gradlew --no-daemon app:assembleAlphaRelease

      # Salin hanya varian arm64-v8a (ukuran ramping) dan ubah namanya
      - name: Prepare Lightweight arm64 APK
        run: |
          cd app/build/outputs/apk/alpha/release/
          TARGET_APK=$(ls *arm64-v8a*.apk 2>/dev/null | head -n 1)
          if [ -n "$TARGET_APK" ]; then
            cp "$TARGET_APK" "DDclash-Meta-arm64-v8a.apk"
          fi

      - name: Sign APK with Debug Keystore
        run: |
          sudo apt-get install -y apksigner
          for apk in app/build/outputs/apk/alpha/release/*.apk; do
            if [ -f "$apk" ]; then
              echo "Signing $apk..."
              apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android "$apk" || true
            fi
          done

      # Upload khusus file arm64-v8a yang ramping
      - name: Upload DDclash Meta (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: DDclash-Meta-arm64-v8a
          path: app/build/outputs/apk/alpha/release/DDclash-Meta-arm64-v8a.apk
          if-no-files-found: error
